# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sahpaathi
      POSTGRES_PASSWORD: sahpaathi
      POSTGRES_DB: sahpaathi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahpaathi -d sahpaathi"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
