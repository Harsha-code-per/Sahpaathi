name: security

# No secrets in the history, no known-vulnerable dependencies. Also weekly, for new advisories.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secrets (gitleaks; reviewed false positives in .gitleaksignore)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact --source .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependencies (pip-audit)
        run: pip install -q pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: App dependencies (npm audit, shipped code only)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
