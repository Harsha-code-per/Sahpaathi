name: app

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint # oxlint with accessibility rules; warnings fail
      - run: npm run format:check
      - run: npm run test:coverage # unit tests with a coverage floor (vite.config.ts)
      - run: npm run build
