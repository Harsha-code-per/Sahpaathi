name: e2e

# The browser smoke test: the real API (SQLite, seeded demo accounts, no paid keys) and the built app,
# every page at desktop and phone size. Fails on a white screen, a console error or a serious
# accessibility violation (axe). See app/e2e/smoke.spec.ts.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run e2e
        env:
          CI: "true"
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: app/test-results
          retention-days: 7
