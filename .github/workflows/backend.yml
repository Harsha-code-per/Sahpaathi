name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sahpaathi
          POSTGRES_PASSWORD: sahpaathi
          POSTGRES_DB: sahpaathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahpaathi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sahpaathi:sahpaathi@localhost:5432/sahpaathi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ffmpeg, so the voice and pack tests run instead of skipping
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply, roll back and re-apply; models match them
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests (real Postgres), with a coverage floor
        run: pytest -q --cov=app --cov-report=term:skip-covered --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image builds (what Render deploys)
        run: docker build -f backend/Dockerfile -t sahpaathi-api .
