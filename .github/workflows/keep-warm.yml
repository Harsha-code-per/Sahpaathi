name: keep-warm

# Render's free tier sleeps after 15 idle minutes and takes ~a minute to wake. Judges use the Studio
# and Admin during evaluation (2–9 Nov), so ping the API every 10 minutes. Remove after 9 Nov.
# (The teacher app needs none of this: it works offline.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://sahpaathi-api.onrender.com/health
